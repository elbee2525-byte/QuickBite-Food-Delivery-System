<!DOCTYPE html>
<html>

<head>
    <title>QuickBite Admin Login</title>
</head>

<body>

    <h2>QuickBite Admin Login</h2>

    <form method="POST">
        <label>Admin Password:</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}

</body>

</html>
